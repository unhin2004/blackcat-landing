<!--
  CANONICAL SITE NAV
  ==================
  Edit here, then run:  npm run build:nav

  Pages opt in by including the start/end marker pair (see scripts/build-nav.js
  and any HTML page for an example). Uses absolute paths so the partial works
  identically from /, /tools/*, and /blog/*.
-->

          <img src="/logo-icon.png" alt="Black Cat" class="w-7 h-7 object-contain" width="28" height="28" fetchpriority="high">
        </picture>
        <span class="font-display font-bold text-lg tracking-tight text-white">Black Cat <span class="text-accent-green">Analytics</span></span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
