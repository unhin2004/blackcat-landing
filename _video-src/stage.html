<!doctype html>
<html><head><meta charset="utf-8"><title>stage</title>
<style>
@font-face{font-family:Outfit;font-weight:700;src:url(file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf)}
@font-face{font-family:Outfit;font-weight:400;src:url(file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Regular.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(file:///home/user/airbnb-profit-dashboard/node_modules/prisma/build/public/assets/inter-latin-400-normal.27ae72da.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(file:///home/user/airbnb-profit-dashboard/node_modules/prisma/build/public/assets/inter-latin-600-normal.87d718a2.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0a0a;font-family:Inter,system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a0a0a}
.glow{position:absolute;border-radius:50%;filter:blur(140px);pointer-events:none}
.glow.g{width:900px;height:900px;left:-300px;top:-350px;background:rgba(34,197,94,.13)}
.glow.b{width:900px;height:900px;right:-300px;bottom:-400px;background:rgba(59,130,246,.12)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.scene{position:absolute;inset:0;opacity:0}
.win{position:absolute;left:120px;top:44px;width:1680px;height:960px;border-radius:18px;background:#0f0f0f;border:1px solid rgba(255,255,255,.10);box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);overflow:hidden}
.chrome{height:44px;background:#141414;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 16px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#2a2a2a}
.url{margin-left:14px;height:26px;flex:0 0 420px;border-radius:7px;background:#1e1e1e;color:#9a9a9a;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.url svg{width:12px;height:12px}
.view{position:absolute;left:0;top:44px;width:1680px;height:916px;overflow:hidden;background:#0a0a0a}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
.cam img{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.ring{position:absolute;border:2px solid #22c55e;border-radius:10px;box-shadow:0 0 0 6px rgba(34,197,94,.18),0 0 40px rgba(34,197,94,.35);opacity:0}
.cap{position:absolute;left:168px;bottom:76px;max-width:860px;padding:30px 38px;border-radius:18px;background:rgba(10,10,10,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 80px rgba(0,0,0,.55);opacity:0}
.cap .k{font-family:Outfit;font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#22c55e;margin-bottom:10px}
.cap h2{font-family:Outfit;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.015em;margin-bottom:12px}
.cap p{font-size:22px;line-height:1.45;color:#c9c9c9}
.sample{position:absolute;right:140px;bottom:56px;font-size:13px;letter-spacing:.06em;color:#8a8a8a;background:rgba(20,20,20,.8);border:1px solid rgba(255,255,255,.08);padding:7px 12px;border-radius:999px;opacity:0}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:150px;height:150px;border-radius:34px;overflow:hidden;box-shadow:0 0 90px rgba(34,197,94,.35),0 30px 80px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08)}
.logo img{width:100%;height:100%;display:block}
.card h1{font-family:Outfit;font-weight:700;font-size:84px;letter-spacing:-.02em;line-height:1.05;margin-top:38px}
.card .sub{font-size:30px;color:#bdbdbd;margin-top:18px}
.card .url2{font-family:Outfit;font-weight:700;font-size:44px;color:#22c55e;margin-top:38px;letter-spacing:-.01em}
.card .fine{font-size:20px;color:#8f8f8f;margin-top:14px}
.el{opacity:0}
</style></head><body>
<div id="stage">
  <div class="glow g"></div><div class="glow b"></div><div class="grid"></div>

  <div class="scene card" id="s-title">
    <div class="logo el"><img src="../logo-icon.png"></div>
    <h1 class="el">Black Cat Analytics</h1>
    <div class="sub el">Profit &amp; tax tracking for short-term rental hosts</div>
  </div>

  <!-- app scenes are generated by JS -->

  <div class="scene card" id="s-end">
    <div class="logo el"><img src="../logo-icon.png"></div>
    <h1 class="el">Know your real rental profit</h1>
    <div class="fine el">Free forever for 1 property &nbsp;·&nbsp; No credit card required</div>
    <div class="url2 el">tryblackcat.com</div>
  </div>

  <div class="sample" id="sample">Sample data</div>
</div>

<script>
const W = 1680, H = 916, IMG_W = 1920, B = W / IMG_W; // base scale
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const eio = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo = (t) => 1 - Math.pow(1 - t, 3);
const ei = (t) => t * t * t;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// Camera helper: region in image coords (1920x1080) -> {z,cx,cy}
const H_EFF = 640; // band above the caption panel where zoomed content is framed
function regionCam(x, y, w, h, pad = 0.03) {
  const z = Math.min(W / (w * B), H_EFF / (h * B)) * (1 - pad);
  return { z, cx: x + w / 2, cy: y + h / 2, top: true };
}
const WIDE = { z: 1, cx: IMG_W / 2, cy: H / (2 * B) };

// ---- Scenes ---------------------------------------------------------------
// Each app scene: still, kicker/headline/body, zoom region (image coords), optional ring.
const APP = [
  { still: "overview", k: "Overview", h: "Know your real profit, per property",
    p: "Revenue minus every tracked expense — for any date range, across all your properties or just one.",
    region: [455, 360, 800, 340], ring: [480, 393, 1214, 186] },
  { still: "bank-sync", k: "Bank sync", h: "Expenses import themselves",
    p: "Connect your bank. Charges are grouped by merchant, matched to what you approved before, and approved in one click.",
    region: [650, 470, 880, 450], ring: [660, 480, 855, 70] },
  { still: "occupancy", k: "Occupancy", h: "Your calendar fills itself",
    p: "Upload your Airbnb CSV and past stays land on the calendar. Sync iCal to keep what’s ahead up to date.",
    region: [381, 325, 1411, 520], ring: [1312, 124, 116, 38], ringAt: 0.7 },
  { still: "tax-reports", k: "Tax & reports", h: "Accountant-ready at tax time",
    p: "A Schedule E worksheet broken out per property, plus a 1099 recipient summary — ready to hand to your CPA.",
    region: [485, 215, 1210, 470], ring: [1096, 371, 573, 41] },
  { still: "analytics", k: "Analytics", h: "See the trend, not just the total",
    p: "Revenue, expenses and profit over time, expense breakdown by category, and performance by property.",
    region: [480, 270, 1214, 520], ring: null },
];

const T_TITLE = 3.4, T_SCENE = 8.0, T_END = 5.6, XF = 0.55; // seconds
const scenes = []; // {el, start, end, kind, def}
let cursor = 0;
scenes.push({ id: "s-title", start: 0, end: T_TITLE, kind: "title" });
cursor = T_TITLE - XF;
const stage = document.getElementById("stage");
const endEl = document.getElementById("s-end");
APP.forEach((d, i) => {
  const el = document.createElement("div");
  el.className = "scene"; el.id = "s-app-" + i;
  el.innerHTML = `
    <div class="win">
      <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>app.tryblackcat.com</div></div>
      <div class="view"><div class="cam"><img src="../video-stills/${d.still}.png">${d.ring ? `<div class="ring" style="left:${d.ring[0]}px;top:${d.ring[1]}px;width:${d.ring[2]}px;height:${d.ring[3]}px"></div>` : ""}</div></div>
    </div>
    <div class="cap"><div class="k">${d.k}</div><h2>${d.h}</h2><p>${d.p}</p></div>`;
  stage.insertBefore(el, endEl);
  scenes.push({ id: el.id, start: cursor, end: cursor + T_SCENE, kind: "app", def: d, el });
  cursor += T_SCENE - XF;
});
scenes.push({ id: "s-end", start: cursor, end: cursor + T_END, kind: "end" });
window.TOTAL = cursor + T_END;

function applyCam(el, cam) {
  const s = B * cam.z;
  const yTop = 36 + H_EFF / 2, yc = cam.top ? (cam.mix === undefined ? yTop : lerp(H / 2, yTop, cam.mix)) : H / 2;
  let tx = W / 2 - cam.cx * s, ty = yc - cam.cy * s;
  tx = clamp(tx, W - IMG_W * s, 0); ty = clamp(ty, H - 1080 * s, 0);
  el.querySelector(".cam").style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  const ring = el.querySelector(".ring");
  if (ring) { ring.style.borderWidth = (2.5 / s) + "px"; ring.style.borderRadius = (10 / s) + "px"; ring.style.boxShadow = `0 0 0 ${6 / s}px rgba(34,197,94,.18), 0 0 ${40 / s}px rgba(34,197,94,.35)`; }
}

function setEl(el, o, y = 0, sc = 1) { el.style.opacity = o; el.style.transform = `translateY(${y}px) scale(${sc})`; }

window.seek = function (t) {
  let sampleOn = 0;
  for (const s of scenes) {
    const el = document.getElementById(s.id);
    if (t < s.start - 0.01 || t > s.end + 0.01) { el.style.opacity = 0; continue; }
    const lt = t - s.start, dur = s.end - s.start;
    const fadeIn = eo(prog(lt, 0, XF)), fadeOut = 1 - ei(prog(lt, dur - XF, dur));
    el.style.opacity = Math.min(fadeIn, fadeOut);
    if (s.kind === "title" || s.kind === "end") {
      const els = el.querySelectorAll(".el");
      els.forEach((e, i) => { const p = eo(prog(lt, 0.15 + i * 0.22, 0.95 + i * 0.22)); setEl(e, p, (1 - p) * 26, s.kind === "title" && i === 0 ? lerp(.9, 1, p) : 1); });
      continue;
    }
    // app scene
    const d = s.def;
    const target = regionCam(...d.region);
    // camera: wide hold (slight push) 0–1.6, zoom 1.6–3.0, drift to end
    let cam;
    if (lt < 1.6) { const p = lt / 1.6; cam = { z: lerp(1, 1.04, p), cx: WIDE.cx, cy: WIDE.cy }; }
    else if (lt < 3.0) { const p = eio(prog(lt, 1.6, 3.0)); cam = { z: lerp(1.04, target.z, p), cx: lerp(WIDE.cx, target.cx, p), cy: lerp(WIDE.cy, target.cy, p), top: true, mix: p }; }
    else { const p = prog(lt, 3.0, dur); cam = { z: target.z * lerp(1, 1.05, p), cx: target.cx, cy: target.cy, top: true }; }
    applyCam(el, cam);
    const ring = el.querySelector(".ring");
    if (ring) { const ra = d.ringAt ?? 2.6; const p = eo(prog(lt, ra, ra + 0.7)); const pulse = 0.75 + 0.25 * Math.sin((lt - 3.3) * 3.2); ring.style.opacity = p * (lt > ra + 0.7 ? pulse : 1); }
    // caption: in at 0.5s, out with the scene
    const cap = el.querySelector(".cap");
    const ci = eo(prog(lt, 0.45, 1.25)), co = 1 - ei(prog(lt, dur - XF - 0.1, dur - 0.1));
    setEl(cap, Math.min(ci, co), (1 - ci) * 28 + (1 - co) * 16);
    // window subtle rise on entry
    const win = el.querySelector(".win"); const wi = eo(prog(lt, 0, 0.9)); win.style.transform = `translateY(${(1 - wi) * 24}px) scale(${lerp(.985, 1, wi)})`;
    sampleOn = Math.max(sampleOn, el.style.opacity);
  }
  document.getElementById("sample").style.opacity = sampleOn;
};
seek(0);
</script>
</body></html>
